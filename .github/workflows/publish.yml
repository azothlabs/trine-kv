name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version to publish. Must match Cargo.toml and CHANGELOG.md.
        required: true
        type: string
      mode:
        description: Run a dry-run or publish to crates.io.
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: crates-io

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@8641a17e25bf5b40c118d48fe0f81e8655731839 # 1.85.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, wasm32-wasip1

      - name: Verify requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"

          if ! python3 -c 'import os,re,sys; v=os.environ["REQUESTED_VERSION"]; p=r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?"; sys.exit(0 if re.fullmatch(p,v) else 1)'; then
            echo "workflow version is not strict SemVer: $REQUESTED_VERSION" >&2
            exit 1
          fi

          if [ "$cargo_version" != "$REQUESTED_VERSION" ]; then
            echo "workflow version $REQUESTED_VERSION does not match Cargo.toml $cargo_version" >&2
            exit 1
          fi

          if ! grep -F -- "## $REQUESTED_VERSION" CHANGELOG.md; then
            echo "CHANGELOG.md is missing an entry for $REQUESTED_VERSION" >&2
            exit 1
          fi

      - name: Check documentation drift
        run: python3 scripts/check_docs_drift.py

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

      - name: Check WASM targets
        run: |
          cargo check --target wasm32-unknown-unknown --lib --all-features
          RUSTFLAGS="-D warnings" cargo check --target wasm32-wasip1 --lib --all-features

      - name: Install Wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3

      - name: Test WASI persistence target
        run: cargo test --target wasm32-wasip1 --lib wasi_persistent
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir .

      - name: Lint browser target
        run: cargo clippy --target wasm32-unknown-unknown --lib --all-features -- -D warnings

      - name: Install wasm-bindgen test runner
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 install wasm-bindgen-cli --version 0.2.122 --locked

      - name: Install Chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1.7.3

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@ef5c64a93512d266b23b80bae95e46a67f30e703 # v2

      - name: Test browser persistence target
        run: cargo test --target wasm32-unknown-unknown --test browser_persistent_wasm --test browser_dedicated_worker_wasm --test browser_shared_worker_wasm
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          WASM_BINDGEN_TEST_ONLY_WEB: "1"
          WASM_BINDGEN_TEST_NO_ORIGIN_ISOLATION: "1"
          CHROMEDRIVER: chromedriver

      - name: Run examples
        run: |
          cargo run --example quickstart
          cargo run --example sync_quickstart
          cargo run --example platform_io
          cargo run --example platform_io --features platform-io
          cargo run --example platform_io --features platform-io-native
          cargo run --example read_versions
          cargo run --example user_store
          cargo run --example event_index

      - name: Run forced-process-exit recovery evidence
        run: >-
          cargo test -q --test production_maturity forced_process_exit_recovery
          -- --ignored --nocapture --test-threads=1

      - name: Run deterministic destructive matrix
        run: cargo test -q destructive_ --lib -- --test-threads=1

      - name: Run concurrent mixed-load evidence
        env:
          TRINE_MATURITY_OPERATIONS: "10000"
        run: >-
          cargo test -q --test production_maturity concurrent_mixed_load_soak_reopens_cleanly
          -- --ignored --nocapture --test-threads=1

      - name: Check package contents
        run: |
          cargo package --list > package-files.txt
          cat package-files.txt
          if grep -E '(^|/)(\.github|\.phrase|\.rust-skills|\.claude)/|^(benches|docs|tests)/' package-files.txt; then
            echo "crate package contains repository-only files" >&2
            exit 1
          fi

      - name: Verify package
        run: cargo package --locked

      - name: Dry-run publish
        run: cargo publish --dry-run --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish to crates.io
        if: ${{ inputs.mode == 'publish' }}
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
